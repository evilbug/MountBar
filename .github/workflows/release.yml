name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Update version in project
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        # Update Info.plist version
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" src/MountBar/Info.plist || true
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" src/MountBar/Info.plist || true

    - name: Build Release
      run: |
        cd src
        
        # Generate fresh icons from source
        echo "🎨 Generating app icons..."
        ../scripts/generate_icons.sh
        
        # Build with custom build directory
        xcodebuild -project MountBar.xcodeproj \
                   -scheme MountBar \
                   -configuration Release \
                   -derivedDataPath build_output \
                   clean build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO
        
        # Create release directory
        mkdir -p release
        
        # Copy app to release (using the custom build output path)
        cp -R build_output/Build/Products/Release/MountBar.app release/
        
        # Strip quarantine attributes (fix "damaged" error)
        echo "🔓 Removing quarantine attributes..."
        xattr -cr release/MountBar.app
        
        # Create DMG
        hdiutil create -volname "MountBar" -srcfolder release/MountBar.app -ov -format UDZO "release/MountBar-${{ steps.get_version.outputs.VERSION }}.dmg"
        
        # Strip quarantine from DMG as well
        echo "🔓 Removing quarantine from DMG..."
        xattr -cr "release/MountBar-${{ steps.get_version.outputs.VERSION }}.dmg"
        
        # Debug: List files before moving
        echo "Contents of release/ directory:"
        ls -la release/
        
        # Move release artifacts to workspace root for the release action
        cd ..  # Move back to the root directory
        
        # The DMG is already in the release/ directory, just rename it
        mv "src/release/MountBar-${{ steps.get_version.outputs.VERSION }}.dmg" MountBar.dmg || {
          echo "Failed to move DMG file"
          ls -la "src/release/"
          exit 1
        }
        # Move the app bundle to the root
        mv "src/release/MountBar.app" ./
        
        # Debug: Verify files were moved correctly
        echo "Contents of workspace root after moving:"
        ls -la

    - name: Generate changelog
      id: changelog
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        
        # Get the previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        
        if [ -n "$PREVIOUS_TAG" ]; then
          echo "Changes since $PREVIOUS_TAG:"
          git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG"..HEAD | grep -v "Merge" || echo "No changes"
        else
          echo "Initial release"
        fi > CHANGELOG.md
        
        cat CHANGELOG.md

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: MountBar ${{ steps.get_version.outputs.VERSION }}
        body_path: CHANGELOG.md
        files: |
          MountBar.dmg
          MountBar.app
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MountBar-${{ steps.get_version.outputs.VERSION }}
        path: |
          MountBar.dmg
        retention-days: 30
